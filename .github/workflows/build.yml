# TEMPORARY scratch branch: fast compile of one file. Never merged.
name: scratch check
on:
  push:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          bash "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain "$(cat lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: mathlib
        run: |
          lake update
          lake exe cache get
      - name: compile scratch
        run: |
          set +e
          lake env lean Scratch.lean > out.log 2>&1
          s=$?
          cat out.log
          python3 -c "import sys; t=open('out.log').read(); print('::warning title=scratch out::'+t.replace('%','%25').replace(chr(10),'%0A')[:30000])"
          echo "lean exit $s"
          exit $s
